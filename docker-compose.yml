services:
  api:
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    env_file: ./backend/.env
    volumes:
      - ./backend:/app
    working_dir: /app

  mcp:
    build:
      context: ./backend
    command: python -m mcp_server.server
    ports: ["8001:8001"]
    env_file: ./backend/.env
    volumes:
      - ./backend:/app
    working_dir: /app
